name: Rust CI with PostgreSQL

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      DATABASE_URL: ${{ steps.set_env.outputs.DATABASE_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Install additional components
        run: |
          rustup component add clippy
          rustup component add rustfmt
          cargo install diesel_cli --no-default-features --features postgres

      - name: Set up DATABASE_URL environment variable
        id: set_env
        run: echo "DATABASE_URL=postgresql://user:password@localhost:5432/test_db" >> $GITHUB_ENV

  build:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Build project
        run: cargo build --verbose

  test:
    runs-on: ubuntu-latest
    needs: build
    services:
      db:
        image: postgres:latest
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..10}; do
            pg_isready -h localhost -p 5432 -U user && break || sleep 5
          done

      - name: Run Diesel setup
        run: diesel setup

      - name: Run tests
        run: cargo test --verbose

  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Run Clippy
        run: cargo clippy -- -D warnings

  format:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check code formatting
        run: cargo fmt --check

  documentation:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Generate documentation
        run: cargo doc --no-deps

  benchmarks:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Run benchmarks
        run: cargo bench

  #security_audit:
  #  runs-on: ubuntu-latest
  #  needs: build
  #  steps:
  #    - name: Run cargo audit
  #      run: cargo audit

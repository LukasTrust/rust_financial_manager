# .github/workflows/ci.yml
name: Rust CI with PostgreSQL

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:latest
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/test_db

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Install Rust toolchain
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      # Install additional components
      - name: Install additional components
        run: |
          rustup component add clippy
          rustup component add rustfmt

      # Install cargo-audit (for the audit step)
      - name: Install cargo-audit
        run: cargo install cargo-audit

      # Install Diesel CLI (for setting up the database)
      - name: Install Diesel CLI
        run: cargo install diesel_cli --no-default-features --features postgres

      # Install cargo-tarpaulin for coverage
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      # Create .env file with DATABASE_URL
      - name: Create .env file
        run: echo "DATABASE_URL=postgresql://user:password@localhost:5432/test_db" > .env

      # Run Diesel setup (creates the database schema)
      - name: Run Diesel setup
        run: diesel setup

      # Set up the Rocket.toml configuration
      - name: Configure Rocket.toml
        run: |
          echo '[debug.databases.postgres_db]' > Rocket.toml
          echo 'url = "postgresql://user:password@localhost:5432/test_db"' >> Rocket.toml

      # Run tests with coverage
      - name: Run tests with coverage
        run: |
          cargo tarpaulin --out Lcov --output-dir ./target/debug/coverage

      # Upload coverage to Codecov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./target/debug/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

      # Run clippy with warnings treated as errors
      - name: Run Clippy
        run: cargo clippy -- -D warnings

      # Check formatting
      - name: Check code formatting
        run: cargo fmt --check

      # Generate documentation (without dependencies)
      - name: Generate documentation
        run: cargo doc --no-deps

      # Run benchmarks
      - name: Run benchmarks
        run: cargo bench
